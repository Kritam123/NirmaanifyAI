# ==============================================================================
# Nirmaanify AI — Netlify Configuration (netlify.toml)
# Turborepo Monorepo Automated Next.js 15 Build & Deployment
# ==============================================================================

[build]
  # Root base directory
  base = ""

  # Build command to compile all monorepo packages and Next.js frontend
  command = "pnpm --filter @nirmaanify/database build && pnpm --filter @nirmaanify/types build && pnpm --filter @nirmaanify/design-tokens build && pnpm --filter @nirmaanify/icons build && pnpm --filter @nirmaanify/ui build && pnpm --filter @nirmaanify/api-client build && pnpm --filter web build"

  # Directory published to Netlify
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "20"
  PNPM_VERSION = "10.4.1"
  NPM_FLAGS = "--version"
  NETLIFY_NEXT_PLUGIN_SKIP = "false"

# Official Next.js Runtime Plugin for App Router & Server Components
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security and Performance Headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
