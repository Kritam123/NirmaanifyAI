name: CD (Deploy to DigitalOcean VPS)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      branch:
        description: 'Git branch or tag to deploy'
        required: true
        default: 'main'
      no_cache:
        description: 'Rebuild Docker images without cache'
        type: boolean
        required: false
        default: false

concurrency:
  group: nirmaanify-single-runner
  cancel-in-progress: false

jobs:
  # ----------------------------------------------------------------------------
  # Single Runner: Build Verification Gate & VPS Deployment (Strictly Sequential)
  # ----------------------------------------------------------------------------
  deploy:
    name: Build, Verify & Deploy to DigitalOcean VPS
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.21.0

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --no-frozen-lockfile
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: '1'

      - name: Generate Prisma Client
        run: pnpm --filter @nirmaanify/database generate

      - name: Cache Turborepo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Verify Types & Build Packages
        run: |
          pnpm --filter @nirmaanify/types build
          pnpm --filter @nirmaanify/database build
          pnpm --filter @nirmaanify/api-client build
          pnpm typecheck

      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DO_HOST }}
          username: ${{ secrets.DO_USER || 'root' }}
          key: ${{ secrets.DO_SSH_KEY }}
          passphrase: ${{ secrets.DO_SSH_PASSPHRASE }}
          port: ${{ secrets.DO_PORT || 22 }}
          command_timeout: 45m
          script_stop: true
          envs: GITHUB_SHA,GITHUB_REF_NAME
          script: |
            set -euo pipefail
            TARGET_DIR="${{ secrets.DO_TARGET_DIR || '' }}"
            if [ -z "$TARGET_DIR" ]; then
                if [ -d "/opt/nirmaanify" ]; then
                    TARGET_DIR="/opt/nirmaanify"
                elif [ -d "/opt/apps/NirmaanifyAI" ]; then
                    TARGET_DIR="/opt/apps/NirmaanifyAI"
                else
                    TARGET_DIR="/opt/nirmaanify"
                fi
            fi

            DEPLOY_BRANCH="${{ inputs.branch || github.ref_name }}"

            echo "==> [CI/CD] Deployment directory: $TARGET_DIR"
            if [ ! -d "$TARGET_DIR" ]; then
                echo "==> [CI/CD] Directory $TARGET_DIR does not exist. Auto-initializing repository on VPS..."
                mkdir -p "$(dirname "$TARGET_DIR")"
                git clone --branch "$DEPLOY_BRANCH" "https://github.com/${{ github.repository }}.git" "$TARGET_DIR" || \
                git clone "https://github.com/${{ github.repository }}.git" "$TARGET_DIR"
            fi

            cd "$TARGET_DIR"

            # Check if Docker is installed; if not, execute automated VPS setup
            if ! command -v docker &> /dev/null; then
                echo "==> [CI/CD] Docker not detected on VPS. Running provisioning script..."
                chmod +x scripts/*.sh
                ./scripts/setup-vps.sh
            fi

            # Check if .env exists; if not, bootstrap from template with secure keys
            if [ ! -f .env ] && [ -f .env.production.example ]; then
                echo "==> [CI/CD] Initializing .env configuration from template..."
                cp .env.production.example .env
                POSTGRES_PASS=$(openssl rand -base64 24 | tr -dc 'a-zA-Z0-9')
                JWT_SEC=$(openssl rand -hex 32)
                AUTH_SEC=$(openssl rand -hex 32)
                sed -i "s/replace_with_strong_db_password_32chars/$POSTGRES_PASS/g" .env
                sed -i "s/replace_with_random_jwt_secret_hex_32_characters/$JWT_SEC/g" .env
                sed -i "s/replace_with_random_auth_secret_hex_32_characters/$AUTH_SEC/g" .env
                sed -i "s/replace_with_strong_minio_password_32chars/$POSTGRES_PASS/g" .env
                sed -i "s/replace_with_strong_redis_password_32chars/$POSTGRES_PASS/g" .env
            fi

            # Ensure .env does not point database to localhost inside Docker
            if [ -f .env ]; then
                sed -i -E 's/@(localhost|127\.0\.0\.1)([:/?]|$)/@postgres\2/g' .env
            fi

            echo "==> [CI/CD] Syncing branch: $DEPLOY_BRANCH"
            git fetch origin "$DEPLOY_BRANCH"
            git checkout "$DEPLOY_BRANCH"
            git reset --hard "origin/$DEPLOY_BRANCH"
            git clean -fd -e .env -e backups

            # Ensure scripts have execute permissions
            chmod +x scripts/*.sh

            # Prepare deploy flags
            FLAGS=""
            if [ "${{ inputs.no_cache }}" = "true" ]; then
                FLAGS="--no-cache"
            fi

            # Reclaim host disk space before building containers while preserving active layer cache
            echo "==> [CI/CD] Managing VPS disk space while preserving active build cache..."
            docker image prune -f 2>/dev/null || true
            docker builder prune -f --keep-storage 5GB --filter "until=72h" 2>/dev/null || \
            docker builder prune -f --filter "until=72h" 2>/dev/null || true
            journalctl --vacuum-size=50M 2>/dev/null || true
            apt-get clean 2>/dev/null || true
            echo "==> [CI/CD] VPS Available Disk Space:"
            df -h /

            # Free up port 80 and 443 from host-level services (e.g. system nginx/apache2)
            echo "==> [CI/CD] Ensuring host ports 80/443 are free for Docker Nginx..."
            if command -v systemctl &>/dev/null; then
                for srv in nginx apache2 httpd lighttpd; do
                    if systemctl is-active --quiet "$srv" 2>/dev/null; then
                        echo "==> [CI/CD] Stopping and disabling host service '$srv'..."
                        systemctl stop "$srv" 2>/dev/null || true
                        systemctl disable "$srv" 2>/dev/null || true
                    fi
                done
            fi

            # Stop any non-nirmaanify containers bound to 80/443
            for port in 80 443; do
                for cid in $(docker ps -q --filter "publish=$port" 2>/dev/null || true); do
                    cname=$(docker inspect --format '{{.Name}}' "$cid" 2>/dev/null | sed 's/^\///')
                    if [ "$cname" != "nirmaanify-nginx" ]; then
                        echo "==> [CI/CD] Stopping conflicting container '$cname' ($cid) on port $port..."
                        docker stop "$cid" 2>/dev/null || true
                    fi
                done
            done

            # Reset stuck nirmaanify-nginx container before deployment
            docker rm -f nirmaanify-nginx 2>/dev/null || true

            echo "==> [CI/CD] Executing production deploy script..."
            export CI=true
            ./scripts/deploy.sh $FLAGS

            echo "==> [CI/CD] Deployment completed successfully on VPS!"

      - name: Health Check Endpoint Verification
        run: |
          echo "Verifying API health status at http://${{ secrets.DO_HOST }}/api/v1..."
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "http://${{ secrets.DO_HOST }}/" || true)
            if [ "$STATUS" = "200" ] || [ "$STATUS" = "301" ] || [ "$STATUS" = "302" ]; then
              echo "✓ Application responded with HTTP $STATUS!"
              exit 0
            fi
            echo "Attempt $i/10: Waiting for services to become responsive (HTTP $STATUS)..."
            sleep 5
          done
          echo "Warning: Direct HTTP check timed out, but containers may still be initializing."

      - name: Publish Deployment Summary
        if: always()
        run: |
          echo "### 🚀 Production Deployment Report" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Droplet Host:** \`${{ secrets.DO_HOST }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Deployed Branch:** \`${{ inputs.branch || github.ref_name }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status == 'success' && '✅ SUCCESS' || '❌ FAILED' }}" >> $GITHUB_STEP_SUMMARY
