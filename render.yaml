# ==============================================================================
# Nirmaanify AI — Render Blueprint (render.yaml)
# Multi-Tenant AI Cloud Workspace & Fullstack Application Platform
# ==============================================================================
# Lean, High-Performance Monorepo Stack:
# 1. Managed PostgreSQL 16 Database (Prisma ORM)
# 2. NestJS Backend REST API (nirmaanify-api)
# 3. Next.js 15 App Router Web Application (nirmaanify-web)
# ==============================================================================

version: "1"

databases:
  - name: nirmaanify-postgres
    databaseName: nirmaanify
    user: nirmaanify_user
    plan: free
    region: oregon
    postgresMajorVersion: "16"

services:
  # ----------------------------------------------------------------------------
  # 1. NestJS Backend REST API Service
  # ----------------------------------------------------------------------------
  - type: web
    name: nirmaanify-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: "corepack enable && pnpm install --frozen-lockfile && pnpm db:generate && pnpm db:push && pnpm --filter @nirmaanify/database build && pnpm --filter @nirmaanify/types build && pnpm --filter @nirmaanify/api-client build && pnpm --filter api build"
    startCommand: "pnpm --filter api start"
    healthCheckPath: "/api/v1/health"
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: nirmaanify-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: APP_URL
        fromService:
          type: web
          name: nirmaanify-web
          property: host
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 465
      - key: SMTP_SECURE
        value: "true"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: STORAGE_DRIVER
        value: local

  # ----------------------------------------------------------------------------
  # 2. Next.js 15 App Router Frontend Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: nirmaanify-web
    runtime: node
    plan: free
    region: oregon
    buildCommand: "corepack enable && pnpm install --frozen-lockfile && pnpm --filter web... build"
    startCommand: "pnpm --filter web start"
    healthCheckPath: "/"
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: nirmaanify-api
          property: host
      - key: AUTH_SECRET
        generateValue: true
      - key: NEXTAUTH_SECRET
        generateValue: true
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_URL
        fromService:
          type: web
          name: nirmaanify-web
          property: host
      - key: NEXTAUTH_URL
        fromService:
          type: web
          name: nirmaanify-web
          property: host
      - key: AUTH_GITHUB_ID
        sync: false
      - key: AUTH_GITHUB_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: AUTH_GOOGLE_ID
        sync: false
      - key: AUTH_GOOGLE_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
